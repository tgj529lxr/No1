name: 构建安卓 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: 编译 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('capacitor.config.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 缓存 npm 缓存目录
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 安装依赖（有 lock 用 ci，无 lock 用 install）
        run: |
          if [ -f package-lock.json ]; then
            echo "发现 package-lock.json，使用 npm ci"
            npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          else
            echo "未发现 package-lock.json，使用 npm install"
            npm install --no-audit --no-fund --registry=https://registry.npmjs.org
          fi

      - name: 准备 JDK 21（Capacitor 7 安卓模板要求 sourceCompatibility 21）
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 校验 Android SDK（runner 已预装 android-35）
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" && echo "OK: android-35 已预装" || echo "MISSING: android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0" && echo "OK: build-tools 35.0.0 已预装" || echo "MISSING: build-tools 35.0.0"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null 2>&1 || true; fi

      - name: 构建 Web 资源到 dist
        run: npm run build

      - name: 生成 Capacitor 安卓工程（已存在则跳过）
        run: |
          if [ -d android ]; then
            echo "android/ 已存在，跳过 cap add"
          else
            npx cap add android
          fi

      - name: 同步 Web 资源与原生插件
        run: npx cap sync android

      - name: 注入相机权限到 AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::找不到 $MANIFEST"
            exit 1
          fi

          # 判重：已声明过 CAMERA 权限则整段跳过，保证幂等
          if grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            echo "AndroidManifest.xml 已包含 CAMERA 权限，跳过注入"
            exit 0
          fi

          # 定位 <manifest ...> 开始标签的结束行（兼容标签跨多行书写）
          INSERT_LINE=$(awk '/<manifest/ { found=NR } found && />/ { print NR; exit }' "$MANIFEST")
          if [ -z "$INSERT_LINE" ]; then
            echo "::error::无法定位 <manifest> 标签"
            exit 1
          fi
          echo "插入到第 $INSERT_LINE 行之后"

          {
            head -n "$INSERT_LINE" "$MANIFEST"
            printf '%s\n' '    <uses-permission android:name="android.permission.CAMERA" />'
            printf '%s\n' '    <uses-feature android:name="android.hardware.camera" android:required="false" />'
            tail -n +"$((INSERT_LINE + 1))" "$MANIFEST"
          } > "$MANIFEST.tmp"

          mv "$MANIFEST.tmp" "$MANIFEST"
          echo "注入完成，结果如下："
          cat "$MANIFEST"

      - name: 编译 Debug APK
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: 失败时把 Gradle 日志尾部写入 annotations（供 API 读取诊断）
        if: failure()
        run: |
          LOG=/tmp/gradle-build.log
          if [ ! -f "$LOG" ]; then
            echo "::error::Gradle 日志文件不存在（gradlew 可能未启动）"
            exit 0
          fi
          # 去掉 ANSI 颜色码、去掉空行，取最后 200 行
          sed -e 's/\x1b\[[0-9;]*m//g' "$LOG" | grep -v '^[[:space:]]*$' | tail -n 200 > /tmp/tail.txt
          echo "日志尾部行数: $(wc -l < /tmp/tail.txt)"
          # 按 3500 字节切块，每块发一条 ::error:: annotation（无 admin 权限也能用 API 读到）
          rm -f /tmp/chunk_*
          split -b 3500 -d /tmp/tail.txt /tmp/chunk_
          for f in /tmp/chunk_*; do
            MSG=$(tr '\n' '~NL~' < "$f")
            echo "::error::GRADLE_LOG_PART::$MSG"
          done

      - name: 整理 APK 文件名
        run: |
          APK_DIR="android/app/build/outputs/apk/debug"
          mkdir -p "$APK_DIR"
          if [ -f "$APK_DIR/app-debug.apk" ]; then
            cp "$APK_DIR/app-debug.apk" "$APK_DIR/attendance-helper-debug.apk"
          else
            FOUND=$(find android/app/build/outputs -maxdepth 3 -name '*.apk' | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "::error::未在任何位置找到生成的 APK"
              exit 1
            fi
            echo "未找到默认路径产物，回退使用：$FOUND"
            cp "$FOUND" "$APK_DIR/attendance-helper-debug.apk"
          fi
          ls -lh "$APK_DIR"

      - name: 上传 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: attendance-helper-debug-apk
          path: android/app/build/outputs/apk/debug/attendance-helper-debug.apk
          if-no-files-found: error
