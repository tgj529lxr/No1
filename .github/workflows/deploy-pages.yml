name: 部署到 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建 PWA 站点
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 npm 缓存目录
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-pages-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-pages-npm-

      - name: 安装依赖（有 lock 用 ci，无 lock 用 install）
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          else
            npm install --no-audit --no-fund --registry=https://registry.npmjs.org
          fi

      - name: 构建 dist
        run: npm run build

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 发布到 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
